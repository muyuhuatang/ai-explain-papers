# Verifies the papers, builds the site, creates a GitHub Release for every new
# paper version and deploys to GitHub Pages.
#
# One-time setup (see README.md): Settings → Pages → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SHOW_DRAFTS=true      also publish draft papers (marked as drafts, never indexed)
#   WAYBACK_ARCHIVE=true  ask the Internet Archive to snapshot each new version

name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel a run that may be halfway through creating releases.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The public URL comes from the Pages settings: https://<user>.github.io/<repo>/
      # today, the custom domain once one is configured.
      - name: Read GitHub Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Verify papers and build the site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SHOW_DRAFTS: ${{ vars.SHOW_DRAFTS }}

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  release:
    name: Release new paper versions
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_urls: ${{ steps.release.outputs.new_urls }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create missing releases and check existing ones
        id: release
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ needs.build.outputs.site_url }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  archive:
    name: Archive new versions (Wayback Machine)
    needs: [release, deploy]
    if: vars.WAYBACK_ARCHIVE == 'true' && needs.release.outputs.new_urls != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request snapshots
        env:
          URLS: ${{ needs.release.outputs.new_urls }}
        run: |
          for url in $URLS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 "https://web.archive.org/save/$url") || code="failed"
            echo "$code $url"
            sleep 15
          done
